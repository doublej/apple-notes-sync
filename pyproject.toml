[project]
name = "apple-notes-sync"
version = "0.1.0"
description = "Two-way task sync between Markdown, Apple Reminders, and Apple Notes with native checklists"
authors = [{ name = "JJ" }]
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.0",
]

[project.scripts]
apple-notes-sync = "apple_notes_sync.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = ["integration: tests that interact with real macOS apps (Reminders, Notes)"]

[tool.hatch.build.targets.wheel]
packages = ["src/apple_notes_sync"]
